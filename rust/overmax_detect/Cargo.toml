[package]
name = "overmax-detect"
version.workspace = true
edition.workspace = true
license.workspace = true
# 앱 전용 크레이트. 재사용 가능한 크레이트는 docs/guides/module-contracts.md §6 참조
publish = false

[lints]
workspace = true

[lib]
name = "overmax_detect"
path = "src/lib.rs"

[dependencies]
overmax-core = { path = "../overmax_core" }
overmax-frame = { path = "../overmax_frame" }
overmax_cv = { path = "../overmax_cv" }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "ico", "jpeg"] }

[features]
default = []
telemetry = []
