[package]
name = "overmax-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
# 앱 전용 크레이트. 재사용 가능한 크레이트는 docs/guides/module-contracts.md §6 참조
publish = false

[lints]
workspace = true

[lib]
name = "overmax_runtime"
path = "src/lib.rs"

[dependencies]
overmax-core = { path = "../overmax_core" }
overmax-data = { path = "../overmax_data" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
