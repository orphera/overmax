[package]
name = "overmax-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "overmax_app"
path = "src/lib.rs"

[[bin]]
name = "overmax-rs"
path = "src/main.rs"

[[bin]]
name = "verify_pipeline"
path = "src/bin/verify_pipeline.rs"

[[bin]]
name = "measure_breakdown"
path = "src/bin/measure_breakdown.rs"


[dependencies]
overmax-engine = { path = "../overmax_engine" }
eframe = { version = "0.36.1", default-features = false, features = [
  "default_fonts",
  "glow",
  "wayland",
  "x11",
] }
egui = "0.36.1"
overmax-core = { path = "../overmax_core" }
overmax-data = { path = "../overmax_data" }
overmax-runtime = { path = "../overmax_runtime" }
overmax_cv = { path = "../overmax_cv" }
serde = { version = "1.0.229", features = ["derive"] }
time = { version = "0.3.55", features = ["local-offset"] }
serde_json = "1"
sha2 = "0.10.8"
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
rfd = "0.15"
image = { version = "0.25.10", default-features = false, features = [
  "png",
  "ico",
  "jpeg",
] }

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = [
  "x11",
  "wayland",
] }
smithay-client-toolkit = { version = "0.20", default-features = false }
wayland-client = { version = "0.31", features = ["system"] }
egui-wgpu = { version = "0.36.1", default-features = false }
wgpu = { version = "30.0.0", default-features = false, features = [
  "std",
  "wgsl",
  "vulkan",
] }
raw-window-handle = "0.6"
pollster = "0.4"
rustix = { version = "1", features = ["event"] }
self_update = { version = "0.44.0", features = [
  "archive-tar",
  "compression-flate2",
] }

[features]
default = []
store = []
telemetry = ["overmax-engine/telemetry"]
portal-capture = ["overmax-engine/portal-capture"]



[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Graphics_Capture",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dxgi_Common",
] }
windows-future = "0.3.2"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Console",
] }
self_update = { version = "0.44.0", features = [
  "archive-zip",
  "compression-zip-deflate",
] }

[build-dependencies]
winres = "0.1.12"

[dev-dependencies]
tempfile = "3"
